spring.application.name=study-companion

# =====================================================================
# PostgreSQL Database
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# Server
# =====================================================================
server.port=${PORT:9192}

# =====================================================================
# File Upload
# =====================================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =====================================================================
# AI PROVIDER
# =====================================================================
ai.provider=groq

ai.temperature=0.3
ai.max-tokens=2000

ai.max-content-chars=12000

ai.connect-timeout-seconds=10
ai.read-timeout-seconds=60

# =====================================================================
# GROQ
# =====================================================================
groq.api.url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b

# =====================================================================
# HUGGING FACE
# =====================================================================
huggingface.api.url=https://router.huggingface.co/v1
huggingface.api.key=${HF_API_KEY:}
huggingface.model=meta-llama/Llama-3.1-8B-Instruct

# =====================================================================
# Logging
# =====================================================================
logging.level.com.aiproof.studycompanion=INFO