spring.application.name=study-companion

# =====================================================================
# PostgreSQL Database
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_study_companion
spring.datasource.username=study_app
spring.datasource.password=StudyApp@123
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Server
# =====================================================================
server.port=9192

# =====================================================================
# File Upload
# =====================================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =====================================================================
# AI PROVIDER
# ---------------------------------------------------------------------
# groq         -> Groq only
# huggingface  -> Hugging Face only
# auto         -> try Groq, fall back to Hugging Face on rate limits,
#                 timeouts and outages (but NOT on a bad model or bad key)
#
# Ollama is no longer used. All Spring AI / Ollama properties have been
# removed, along with the spring-ai dependencies in pom.xml.
# =====================================================================
ai.provider=groq

ai.temperature=0.3
ai.max-tokens=2000

# How much of a PDF is sent to the AI. 12000 characters is roughly
# 3000 tokens: fast, cheap, and enough for a good quiz.
ai.max-content-chars=12000

# Never let the browser hang forever.
ai.connect-timeout-seconds=10
ai.read-timeout-seconds=60

# =====================================================================
# GROQ (primary)
# ---------------------------------------------------------------------
# Key comes from the GROQ_API_KEY environment variable.
# NEVER paste a gsk_... key into this file.
#
# MODEL WARNING: llama-3.3-70b-versatile and llama-3.1-8b-instant are
# Enterprise-only on GroqCloud. A normal developer account gets HTTP 403
# when it asks for them. Generally available chat models:
#     openai/gpt-oss-20b    (fast and cheap - default below)
#     openai/gpt-oss-120b   (stronger, slower)
# =====================================================================
groq.api.url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b

# =====================================================================
# HUGGING FACE (fallback)
# ---------------------------------------------------------------------
# Uses the Inference Providers router, which is OpenAI-compatible.
# Your token must be a FINE-GRAINED token with the permission
# "Make calls to Inference Providers" enabled.
# =====================================================================
huggingface.api.url=https://router.huggingface.co/v1
huggingface.api.key=${HF_API_KEY:}
huggingface.model=meta-llama/Llama-3.1-8B-Instruct

# =====================================================================
# Logging
# ---------------------------------------------------------------------
# API keys, JWTs and passwords are never logged anywhere in this app.
# =====================================================================
logging.level.com.aiproof.studycompanion=INFO
